name: Daily FX3 deal scrape

# Runs once a day automatically (GitHub's servers do the work -- your
# phone/laptop doesn't need to be on), plus you can trigger it manually
# any time from the Actions tab ("Run workflow" button).
#
# NOTE: scheduled workflows only fire from whatever is on the repo's
# default branch. If this file currently lives on a feature branch, the
# daily run won't actually start until it's merged into main. Manual runs
# (workflow_dispatch) work from any branch in the meantime.
on:
  schedule:
    - cron: "0 13 * * *"  # 13:00 UTC daily -- ~6am Pacific / 9am Eastern. Edit to taste.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install headless browser for the retail-site scrapers
        run: playwright install --with-deps chromium

      - name: Run scrapers
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          REVERB_API_TOKEN: ${{ secrets.REVERB_API_TOKEN }}
        run: python -m scrapers.run_all

      - name: Rebuild dashboard
        run: python -m app.generate_dashboard

      - name: Commit and push updated data + dashboard
        run: |
          git config user.name "fx3-deal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/listings.db docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily scrape: $(date -u +'%Y-%m-%d')"
            git push
          fi
